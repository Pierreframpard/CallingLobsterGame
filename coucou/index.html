<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coucou - Calling Lobster</title>
  <style>
    :root { color-scheme: dark; --ink: #17212b; --paper: #faf8ec; --coral: #ff766f; --gold: #f5c75e; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 20%, #fff6ca 0 16%, #9ee6c1 17% 42%, #17212b 43% 100%);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    main { width: min(92vw, 760px); display: grid; justify-items: center; gap: 24px; text-align: center; }
    h1 {
      margin: 0;
      color: var(--paper);
      font-size: clamp(3rem, 14vw, 8rem);
      letter-spacing: 0;
      text-shadow: 0 8px 0 rgba(23, 33, 43, .55);
      animation: hello 900ms steps(2, end) infinite;
    }
    .gif-wrap {
      width: min(58vw, 320px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      image-rendering: pixelated;
      filter: drop-shadow(0 18px 0 rgba(23, 33, 43, .28));
      animation: bounce 1.2s ease-in-out infinite;
    }
    img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    p { margin: 0; max-width: 38rem; color: #fff7da; font-size: clamp(1.05rem, 3vw, 1.45rem); line-height: 1.45; }
    a { color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 8px; padding: 12px 18px; text-decoration: none; font-weight: 800; box-shadow: 0 6px 0 rgba(23, 33, 43, .45); }
    @keyframes hello { 0%, 100% { transform: rotate(-2deg) scale(1); color: var(--paper); } 50% { transform: rotate(2deg) scale(1.05); color: var(--coral); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  </style>
</head>
